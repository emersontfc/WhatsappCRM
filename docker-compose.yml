services:
  agentx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentx-crm
    restart: unless-stopped
    ports:
      # Bound strictly to localhost so internet traffic must pass through Nginx reverse proxy
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 1800M
        reservations:
          memory: 512M
    mem_limit: 1800m
    mem_reservation: 512m
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent storage for uploaded media (voice notes, images, PDFs)
      - ./uploads:/app/uploads
      # Persistent storage for Baileys WhatsApp sessions
      - ./whatsapp_sessions_data:/app/whatsapp_sessions_data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

