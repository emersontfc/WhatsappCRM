# ================================================================
# AgentX / WhatsCRM SaaS - Nginx Reverse Proxy Configuration
# Place this file in /etc/nginx/sites-available/agentx
# Enable: ln -s /etc/nginx/sites-available/agentx /etc/nginx/sites-enabled/
# ================================================================

# Upstream Node.js application server
upstream agentx_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS (Certbot will manage SSL certs)
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com www.seudominio.com; # Substitua pelo seu domínio real

    # Allow Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com www.seudominio.com; # Substitua pelo seu domínio real

    # SSL Certificates (managed by Certbot: sudo certbot --nginx -d seudominio.com)
    ssl_certificate /etc/letsencrypt/live/seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size (audio recordings, status media, documents)
    client_max_body_size 50M;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static build assets
    location ~* \.(?:css|js|woff2?|svg|ico|png|jpg|jpeg|gif|webp)$ {
        proxy_pass http://agentx_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploads direct access (audio, attachments)
    location /uploads/ {
        proxy_pass http://agentx_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Main application and API proxy
    location / {
        proxy_pass http://agentx_backend;
        proxy_http_version 1.1;

        # WebSocket support (Required for Realtime, Baileys & Copilot)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long AI processing and file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

